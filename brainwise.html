<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}">
<head>
  {% include head.html %}
  <title>Brainwise | Brain, thinking and aging</title>
  <style>
    html, body { margin: 0; min-height: 100%; width: 100%; overflow-x: clip; }
    #brainwise-frame { display: block; box-sizing: border-box; width: 100%; min-height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe id="brainwise-frame" src="{{ '/brainwise-v3.html' | relative_url }}" title="Brainwise interactive guide to brain, thinking and aging"></iframe>
  <script>
    const frame = document.getElementById('brainwise-frame');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc) return;
      const resize = () => { frame.style.height = Math.ceil(doc.body.scrollHeight + 4) + 'px'; };
      new ResizeObserver(resize).observe(doc.body);
      resize();
    });
  </script>
</body>
</html>
