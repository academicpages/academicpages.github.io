{% assign slides = include.item.thumbnails %}
{% if slides and slides.size > 0 %}
<div class="portfolio-thumb-slider"
     tabindex="0"
     aria-label="Image gallery for {{ include.item.title | escape }}">
  {% for slide in slides %}
    <div class="portfolio-thumb-slide{% if forloop.first %} is-active{% endif %}"
         {% unless forloop.first %}hidden{% endunless %}>
      <img src="{{ slide.src | relative_url }}"
           alt="{{ slide.alt | default: include.item.title | escape }}"
           loading="lazy">
    </div>
  {% endfor %}

  {% if slides.size > 1 %}
    <button type="button" class="portfolio-thumb-prev"
            aria-label="Previous image">❮</button>
    <button type="button" class="portfolio-thumb-next"
            aria-label="Next image">❯</button>
    <div class="portfolio-thumb-counter" aria-live="polite">
      1 / {{ slides.size }}
    </div>
  {% endif %}
</div>
{% endif %}
