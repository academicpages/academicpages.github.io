{% include base_path %}

{% capture share_url %}{{ base_path }}{{ page.url }}{% endcapture %}
{% capture share_title %}{{ page.title | markdownify | strip_html | strip_newlines | uri_escape }}{% endcapture %}

<section class="page__share" aria-label="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share' }}">
  <span class="page__share-title">{{ site.data.ui-text[site.locale].share_on_label | default: "Share" }}</span>
  <div class="page__share-links">
    <a
      href="https://twitter.com/intent/tweet?text={{ share_title }}&amp;url={{ share_url | uri_escape }}"
      class="page__share-link"
      title="Share on X"
      aria-label="Share on X"
    >
      <i class="fab fa-x-twitter" aria-hidden="true"></i>
    </a>
    <a
      href="https://www.linkedin.com/shareArticle?mini=true&amp;url={{ share_url | uri_escape }}&amp;title={{ share_title }}"
      class="page__share-link"
      title="Share on LinkedIn"
      aria-label="Share on LinkedIn"
    >
      <i class="fab fa-linkedin-in" aria-hidden="true"></i>
    </a>
    <a
      href="https://www.facebook.com/sharer/sharer.php?u={{ share_url | uri_escape }}"
      class="page__share-link"
      title="Share on Facebook"
      aria-label="Share on Facebook"
    >
      <i class="fab fa-facebook-f" aria-hidden="true"></i>
    </a>
  </div>
</section>
