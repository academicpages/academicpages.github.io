<style>
  .student-portfolio {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.5rem;
    margin-top: 2rem;
  }

  .student-portfolio figure {
    margin: 0;
    overflow: hidden;
    border: 1px solid #d6d6d6;
    background: #fff;
    box-shadow: 0 5px 16px rgba(0, 0, 0, 0.08);
  }

  .student-portfolio img {
    display: block;
    width: 100%;
    aspect-ratio: 5 / 3;
    object-fit: cover;
  }

  .student-portfolio figcaption {
    padding: 0.9rem 1rem;
    font-weight: 700;
  }

  @media (max-width: 700px) {
    .student-portfolio {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
  }
</style>
