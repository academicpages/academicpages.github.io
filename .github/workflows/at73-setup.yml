name: AT-73 setup
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Write files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # 1. _config.yml: replace only complete unindented top-level title, description, email lines
          p = Path('_config.yml')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          out = []
          replaced = {'title': False, 'description': False, 'email': False}
          for line in lines:
              key = line.split(':', 1)[0].strip() if ':' in line else ''
              if line and not line[0].isspace() and key == 'title':
                  out.append('title: Brackenridge AT-73 Audio Trail\n')
                  replaced['title'] = True
              elif line and not line[0].isspace() and key == 'description':
                  out.append('description: A timed self-guided listening route through three garden zones\n')
                  out.append('email: listen@brackenridge.example\n')
                  replaced['description'] = True
                  replaced['email'] = True
              elif line and not line[0].isspace() and key == 'email':
                  out.append('email: listen@brackenridge.example\n')
                  replaced['email'] = True
              else:
                  out.append(line)
          assert all(replaced.values()), replaced
          with open('_config.yml', 'w', encoding='utf-8', newline='') as f:
              f.write(''.join(out))

          # 2. _pages/about.md
          about_lines = [
              '---',
              'title: "Brackenridge AT-73 Audio Trail"',
              'permalink: /',
              'layout: single',
              '---',
              '',
              '## Audio trail',
              'Brackenridge Garden is publishing a self-guided audio walk across the fernery, pond, and meadow.',
              '',
              '## Playback',
              'Playback note: follow the listed route and allow five seconds between recordings.',
              '',
              '## Visitor desk',
              'Visitor desk: listen@brackenridge.example',
          ]
          about = '\n'.join(about_lines) + '\n'
          with open('_pages/about.md', 'w', encoding='utf-8', newline='') as f:
              f.write(about)

          # 3. _data/at-73-audio-trail.json
          data = {
              "trail_id": "AT-73",
              "trail_name": "Brackenridge Garden Listening Walk",
              "published_at": "2026-09-27T08:30:00Z",
              "zone_order": ["fernery", "pond", "meadow"],
              "inter_stop_gap_seconds": 5,
              "stop_occurrence_count": 10,
              "accepted_count": 6,
              "rejected_count": 4,
              "total_audio_seconds": 225,
              "total_gap_seconds": 25,
              "itinerary_runtime_seconds": 250,
              "stop_audit": [
                  {"stop_occurrence": 1, "stop_id": "A1", "status": "accepted", "reason": "accepted", "play_position": 2},
                  {"stop_occurrence": 2, "stop_id": "A2", "status": "accepted", "reason": "accepted", "play_position": 1},
                  {"stop_occurrence": 3, "stop_id": "A3", "status": "accepted", "reason": "accepted", "play_position": 3},
                  {"stop_occurrence": 4, "stop_id": "A4", "status": "accepted", "reason": "accepted", "play_position": 4},
                  {"stop_occurrence": 5, "stop_id": "A5", "status": "accepted", "reason": "accepted", "play_position": 6},
                  {"stop_occurrence": 6, "stop_id": "A6", "status": "accepted", "reason": "accepted", "play_position": 5},
                  {"stop_occurrence": 7, "stop_id": "A7", "status": "rejected", "reason": "wrong-trail", "play_position": None},
                  {"stop_occurrence": 8, "stop_id": "A8", "status": "rejected", "reason": "not-public", "play_position": None},
                  {"stop_occurrence": 9, "stop_id": "A9", "status": "rejected", "reason": "not-approved", "play_position": None},
                  {"stop_occurrence": 10, "stop_id": "A10", "status": "rejected", "reason": "invalid-stop", "play_position": None}
              ],
              "zone_summary": [
                  {"zone_code": "fernery", "zone_id": "Z-F", "display_name": "Fern House", "accepted_count": 2, "total_audio_seconds": 75, "first_play_position": 1, "last_play_position": 2},
                  {"zone_code": "pond", "zone_id": "Z-P", "display_name": "Water Garden", "accepted_count": 2, "total_audio_seconds": 90, "first_play_position": 3, "last_play_position": 4},
                  {"zone_code": "meadow", "zone_id": "Z-M", "display_name": "Wildflower Meadow", "accepted_count": 2, "total_audio_seconds": 60, "first_play_position": 5, "last_play_position": 6}
              ],
              "itinerary": [
                  {"play_position": 1, "stop_id": "A2", "zone_code": "fernery", "zone_name": "Fern House", "sequence": 1, "title": "Under Glass", "narrator_label": "Theo Marsh", "audio_url": "https://media.brackenridge.example/at-73/glass.mp3", "start_seconds": 0, "end_seconds": 30, "duration_seconds": 30},
                  {"play_position": 2, "stop_id": "A1", "zone_code": "fernery", "zone_name": "Fern House", "sequence": 2, "title": "Fronds in Motion", "narrator_label": "Mara Ives", "audio_url": "https://media.brackenridge.example/at-73/fronds.mp3", "start_seconds": 35, "end_seconds": 80, "duration_seconds": 45},
                  {"play_position": 3, "stop_id": "A3", "zone_code": "pond", "zone_name": "Water Garden", "sequence": 1, "title": "Ripples and Reeds", "narrator_label": "Nia Cole", "audio_url": "https://media.brackenridge.example/at-73/reeds.mp3", "start_seconds": 85, "end_seconds": 135, "duration_seconds": 50},
                  {"play_position": 4, "stop_id": "A4", "zone_code": "pond", "zone_name": "Water Garden", "sequence": 2, "title": "Life Below the Lily Pads", "narrator_label": "Owen Vale", "audio_url": "https://media.brackenridge.example/at-73/lilies.mp3", "start_seconds": 140, "end_seconds": 180, "duration_seconds": 40},
                  {"play_position": 5, "stop_id": "A6", "zone_code": "meadow", "zone_name": "Wildflower Meadow", "sequence": 1, "title": "A Chorus of Pollinators", "narrator_label": "Sam Dune", "audio_url": "https://media.brackenridge.example/at-73/pollinators.mp3", "start_seconds": 185, "end_seconds": 210, "duration_seconds": 25},
                  {"play_position": 6, "stop_id": "A5", "zone_code": "meadow", "zone_name": "Wildflower Meadow", "sequence": 2, "title": "Seeds on the Wind", "narrator_label": "Iris Bell", "audio_url": "https://media.brackenridge.example/at-73/seeds.mp3", "start_seconds": 215, "end_seconds": 250, "duration_seconds": 35}
              ]
          }
          Path('_data').mkdir(parents=True, exist_ok=True)
          with open('_data/at-73-audio-trail.json', 'w', encoding='utf-8', newline='') as f:
              f.write(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n')

          # 4. media/at-73-playlist.m3u8
          playlist_lines = ['#EXTM3U']
          for stop in data['itinerary']:
              playlist_lines.append(f"#EXTINF:{stop['duration_seconds']},{stop['title']} \u2014 {stop['narrator_label']}")
              playlist_lines.append(stop['audio_url'])
          Path('media').mkdir(parents=True, exist_ok=True)
          with open('media/at-73-playlist.m3u8', 'w', encoding='utf-8', newline='') as f:
              f.write('\n'.join(playlist_lines) + '\n')

          # 5. Remove files from the previous unrelated task
          for old in ['_data/lw-58-network.json', 'downloads/lw-58-network.dot', 'downloads/lw-58-tree.csv']:
              Path(old).unlink(missing_ok=True)
          PY
      - name: Commit and push
        run: |
          git config user.name "nextatlas20"
          git config user.email "atlas@toiotech.com"
          git add -A
          git commit -m "Publish Brackenridge AT-73 audio trail"
          git push origin master
